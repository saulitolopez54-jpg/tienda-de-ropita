<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Moda Urbana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">MODA <span>URBANA</span></a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-4">Iniciar sesión</h3>
            
            <div class="d-flex gap-2 mb-4">
              <button class="btn btn-outline-dark flex-fill" onclick="loginSocial('Google')">
                <i class="bi bi-google"></i> Google
              </button>
              <button class="btn btn-outline-dark flex-fill" onclick="loginSocial('Facebook')">
                <i class="bi bi-facebook"></i> Facebook
              </button>
            </div>

            <div class="text-center text-muted small mb-3">o con tu correo</div>

            <form id="form-login" onsubmit="manejarLogin(event)">
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="recordar">
                  <label class="form-check-label small" for="recordar">Recordarme</label>
                </div>
                <a href="#" class="small" onclick="mostrarRecuperar()">¿Olvidaste tu contraseña?</a>
              </div>
              <button type="submit" class="btn btn-gold w-100 btn-lg">Iniciar sesión</button>
            </form>

            <div id="form-recuperar" class="d-none mt-3">
              <hr>
              <h6>Recuperar contraseña</h6>
              <div class="mb-3">
                <input type="email" class="form-control" id="email-recuperar" placeholder="Tu correo">
              </div>
              <button class="btn btn-dark-custom w-100" onclick="recuperar()">Enviar enlace</button>
            </div>

            <p class="text-center mt-4 mb-0 small">
              ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>

            <div class="alert alert-info mt-3 small">
              <strong>Demo admin:</strong><br>
              Email: admin@tienda.com<br>
              Contraseña: admin123
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    function manejarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultado = iniciarSesion(email, password);
      
      if (resultado.success) {
        mostrarAlerta(resultado.message, 'success');
        setTimeout(() => {
          if (email === 'admin@tienda.com') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);
      } else {
        mostrarAlerta(resultado.message, 'danger');
      }
    }

    function loginSocial(proveedor) {
      // Simulación de login social
      const usuario = {
        id: Date.now(),
        nombre: 'Usuario ' + proveedor,
        email: 'usuario.' + proveedor.toLowerCase() + '@email.com',
        password: '',
        direcciones: [],
        pedidos: [],
        fechaRegistro: new Date().toISOString()
      };
      localStorage.setItem('usuarioActual', JSON.stringify(usuario));
      
      // Guardar también en lista de usuarios si no existe
      const usuarios = obtenerUsuarios();
      if (!usuarios.find(u => u.email === usuario.email)) {
        usuarios.push(usuario);
        guardarUsuarios(usuarios);
      }
      
      mostrarAlerta('Sesión iniciada con ' + proveedor, 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    }

    function mostrarRecuperar() {
      document.getElementById('form-recuperar').classList.toggle('d-none');
    }

    function recuperar() {
      const email = document.getElementById('email-recuperar').value;
      if (!email) return;
      const res = recuperarPassword(email);
      mostrarAlerta(res.message, res.success ? 'success' : 'danger');
    }
  </script>
</body>
</html>
