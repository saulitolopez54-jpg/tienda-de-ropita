<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto | Moda Urbana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">MODA <span>URBANA</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
        </ul>
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item me-3">
            <a class="nav-link position-relative" href="carrito.html">
              <i class="bi bi-bag fs-5"></i>
              <span class="cart-badge">0</span>
            </a>
          </li>
          <li class="nav-item" id="nav-login">
            <a class="nav-link" href="login.html"><i class="bi bi-person"></i> Ingresar</a>
          </li>
          <li class="nav-item dropdown d-none" id="nav-user">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span id="nombre-usuario"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div id="producto-detalle">
      <!-- Se llena con JS -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const producto = obtenerProductoPorId(id);

      if (!producto) {
        document.getElementById('producto-detalle').innerHTML = `
          <div class="text-center py-5">
            <h3>Producto no encontrado</h3>
            <a href="catalogo.html" class="btn btn-dark-custom mt-3">Volver al catálogo</a>
          </div>`;
        return;
      }

      const tallasDisponibles = Object.keys(producto.stock).filter(t => producto.stock[t] > 0);

      document.getElementById('producto-detalle').innerHTML = `
        <div class="row g-4">
          <div class="col-md-6">
            <img src="${producto.imagen}" class="img-fluid rounded-4 shadow" alt="${producto.nombre}"
                 onerror="this.src='https://via.placeholder.com/500x600?text=Producto'" style="width:100%; max-height:550px; object-fit:cover;">
          </div>
          <div class="col-md-6">
            ${producto.nuevo ? '<span class="badge bg-warning text-dark mb-2">NUEVO</span>' : ''}
            <h2 class="fw-bold">${producto.nombre}</h2>
            <div class="mb-3">
              ${producto.precioAnterior ? `<span class="old-price fs-5">${formatearPrecio(producto.precioAnterior)}</span>` : ''}
              <span class="price fs-3">${formatearPrecio(producto.precio)}</span>
            </div>
            <p class="text-muted">${producto.descripcion}</p>
            
            <div class="mb-3">
              <label class="form-label fw-semibold">Color</label>
              <div class="d-flex gap-2 flex-wrap" id="colores">
                ${producto.colores.map((c, i) => `
                  <button type="button" class="btn btn-outline-dark btn-sm color-btn ${i===0?'active':''}" 
                          data-color="${c}" onclick="seleccionarColor(this)">${c}</button>
                `).join('')}
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Talla</label>
              <div class="d-flex gap-2 flex-wrap" id="tallas">
                ${tallasDisponibles.map((t, i) => `
                  <button type="button" class="btn btn-outline-dark btn-sm talla-btn ${i===0?'active':''}" 
                          data-talla="${t}" onclick="seleccionarTalla(this)">${t}</button>
                `).join('')}
              </div>
              <small class="text-muted d-block mt-1">Disponibles: ${tallasDisponibles.map(t => t + ' (' + producto.stock[t] + ')').join(', ')}</small>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Cantidad</label>
              <input type="number" class="form-control w-25" id="cantidad" value="1" min="1" max="10">
            </div>

            <button class="btn btn-gold btn-lg w-100 mb-2" onclick="agregarProducto()">
              <i class="bi bi-bag-plus"></i> Agregar al carrito
            </button>
            <a href="carrito.html" class="btn btn-outline-dark w-100">Ver carrito</a>
          </div>
        </div>
      `;
    });

    let colorSeleccionado = '';
    let tallaSeleccionada = '';

    function seleccionarColor(btn) {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      colorSeleccionado = btn.dataset.color;
    }

    function seleccionarTalla(btn) {
      document.querySelectorAll('.talla-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tallaSeleccionada = btn.dataset.talla;
    }

    function agregarProducto() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const cantidad = parseInt(document.getElementById('cantidad').value) || 1;

      // Tomar valores por defecto si no se seleccionó
      if (!colorSeleccionado) {
        const first = document.querySelector('.color-btn');
        if (first) colorSeleccionado = first.dataset.color;
      }
      if (!tallaSeleccionada) {
        const first = document.querySelector('.talla-btn');
        if (first) tallaSeleccionada = first.dataset.talla;
      }

      if (!tallaSeleccionada || !colorSeleccionado) {
        mostrarAlerta('Selecciona talla y color', 'warning');
        return;
      }

      const ok = agregarAlCarrito(id, tallaSeleccionada, colorSeleccionado, cantidad);
      if (ok) {
        mostrarAlerta('Producto agregado al carrito', 'success');
      }
    }
  </script>
</body>
</html>
