<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Moda Urbana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">MODA <span>URBANA</span></a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-4">Crear cuenta</h3>

            <div class="d-flex gap-2 mb-4">
              <button class="btn btn-outline-dark flex-fill" onclick="registroSocial('Google')">
                <i class="bi bi-google"></i> Google
              </button>
              <button class="btn btn-outline-dark flex-fill" onclick="registroSocial('Facebook')">
                <i class="bi bi-facebook"></i> Facebook
              </button>
            </div>

            <div class="text-center text-muted small mb-3">o regístrate con correo</div>

            <form onsubmit="manejarRegistro(event)">
              <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" required placeholder="Tu nombre">
              </div>
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
              </div>
              <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="password2" required placeholder="Repite la contraseña">
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terminos" required>
                <label class="form-check-label small" for="terminos">
                  Acepto los términos y condiciones
                </label>
              </div>
              <button type="submit" class="btn btn-gold w-100 btn-lg">Crear cuenta</button>
            </form>

            <p class="text-center mt-4 mb-0 small">
              ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    function manejarRegistro(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password !== password2) {
        mostrarAlerta('Las contraseñas no coinciden', 'danger');
        return;
      }

      const resultado = registrarUsuario(nombre, email, password);
      if (resultado.success) {
        mostrarAlerta(resultado.message, 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else {
        mostrarAlerta(resultado.message, 'danger');
      }
    }

    function registroSocial(proveedor) {
      const usuario = {
        id: Date.now(),
        nombre: 'Usuario ' + proveedor,
        email: 'usuario.' + proveedor.toLowerCase() + '@email.com',
        password: '',
        direcciones: [],
        pedidos: [],
        fechaRegistro: new Date().toISOString()
      };
      localStorage.setItem('usuarioActual', JSON.stringify(usuario));
      const usuarios = obtenerUsuarios();
      if (!usuarios.find(u => u.email === usuario.email)) {
        usuarios.push(usuario);
        guardarUsuarios(usuarios);
      }
      mostrarAlerta('Cuenta creada con ' + proveedor, 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    }
  </script>
</body>
</html>
