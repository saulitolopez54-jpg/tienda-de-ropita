<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Moda Urbana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">MODA <span>URBANA</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html?genero=hombre">Hombre</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html?genero=mujer">Mujer</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html?genero=ninos">Niños</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html?categoria=deportes">Deportes</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html?categoria=tenis">Tenis</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item me-3">
            <a class="nav-link position-relative" href="carrito.html">
              <i class="bi bi-bag fs-5"></i>
              <span class="cart-badge">0</span>
            </a>
          </li>
          <li class="nav-item" id="nav-login">
            <a class="nav-link" href="login.html"><i class="bi bi-person"></i> Ingresar</a>
          </li>
          <li class="nav-item dropdown d-none" id="nav-user">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span id="nombre-usuario"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="admin.html" id="link-admin" style="display:none;">Panel Admin</a></li>
              <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row">
      <!-- Filtros -->
      <div class="col-lg-3 mb-4">
        <div class="filter-sidebar">
          <h5 class="fw-bold mb-3">Filtros</h5>
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Género</label>
            <select class="form-select form-select-sm" id="filtro-genero">
              <option value="">Todos</option>
              <option value="hombre">Hombre</option>
              <option value="mujer">Mujer</option>
              <option value="ninos">Niños</option>
              <option value="unisex">Unisex</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Categoría</label>
            <select class="form-select form-select-sm" id="filtro-categoria">
              <option value="">Todas</option>
              <option value="camisas">Camisas</option>
              <option value="blusas">Blusas</option>
              <option value="pantalones">Pantalones</option>
              <option value="vestidos">Vestidos</option>
              <option value="sudaderas">Sudaderas</option>
              <option value="shorts">Shorts</option>
              <option value="deportes">Deportes</option>
              <option value="tenis">Tenis</option>
              <option value="accesorios">Accesorios</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Precio máximo</label>
            <input type="range" class="form-range" id="filtro-precio" min="200" max="1200" step="50" value="1200">
            <div class="d-flex justify-content-between small text-muted">
              <span>$200</span>
              <span id="precio-valor">$1200</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Ordenar por</label>
            <select class="form-select form-select-sm" id="filtro-orden">
              <option value="destacado">Destacados</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="nuevo">Más nuevos</option>
            </select>
          </div>

          <button class="btn btn-dark-custom w-100 btn-sm" onclick="aplicarFiltros()">Aplicar</button>
          <button class="btn btn-outline-secondary w-100 btn-sm mt-2" onclick="limpiarFiltros()">Limpiar</button>
        </div>
      </div>

      <!-- Productos -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0 fw-bold" id="titulo-catalogo">Todos los productos</h4>
          <span class="text-muted small" id="contador-productos"></span>
        </div>
        <div id="lista-productos" class="productos-grid">
          <!-- Se llenan con JS -->
        </div>
        <div id="sin-resultados" class="text-center py-5 d-none">
          <i class="bi bi-search fs-1 text-muted"></i>
          <p class="mt-2 text-muted">No se encontraron productos con esos filtros.</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="text-center small mb-0">&copy; 2026 Moda Urbana</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let productosFiltrados = [];

    document.addEventListener('DOMContentLoaded', () => {
      // Leer parámetros de URL
      const params = new URLSearchParams(window.location.search);
      if (params.get('genero')) document.getElementById('filtro-genero').value = params.get('genero');
      if (params.get('categoria')) document.getElementById('filtro-categoria').value = params.get('categoria');
      if (params.get('nuevo')) document.getElementById('filtro-orden').value = 'nuevo';

      // Actualizar valor del rango
      const rango = document.getElementById('filtro-precio');
      rango.addEventListener('input', () => {
        document.getElementById('precio-valor').textContent = '$' + rango.value;
      });

      aplicarFiltros();

      // Admin link
      const user = obtenerUsuarioActual();
      if (user && (user.email === 'admin@tienda.com' || user.rol === 'admin')) {
        const link = document.getElementById('link-admin');
        if (link) link.style.display = 'block';
      }
    });

    function aplicarFiltros() {
      let productos = obtenerProductos();
      const genero = document.getElementById('filtro-genero').value;
      const categoria = document.getElementById('filtro-categoria').value;
      const precioMax = parseInt(document.getElementById('filtro-precio').value);
      const orden = document.getElementById('filtro-orden').value;

      if (genero) productos = productos.filter(p => p.genero === genero);
      if (categoria) productos = productos.filter(p => p.categoria === categoria);
      productos = productos.filter(p => p.precio <= precioMax);

      // Orden
      if (orden === 'precio-asc') productos.sort((a,b) => a.precio - b.precio);
      else if (orden === 'precio-desc') productos.sort((a,b) => b.precio - a.precio);
      else if (orden === 'nuevo') productos.sort((a,b) => (b.nuevo ? 1 : 0) - (a.nuevo ? 1 : 0));
      else productos.sort((a,b) => (b.destacado ? 1 : 0) - (a.destacado ? 1 : 0));

      productosFiltrados = productos;
      renderProductos();
    }

    function limpiarFiltros() {
      document.getElementById('filtro-genero').value = '';
      document.getElementById('filtro-categoria').value = '';
      document.getElementById('filtro-precio').value = 1200;
      document.getElementById('precio-valor').textContent = '$1200';
      document.getElementById('filtro-orden').value = 'destacado';
      aplicarFiltros();
    }

    function renderProductos() {
      const contenedor = document.getElementById('lista-productos');
      const sinResultados = document.getElementById('sin-resultados');
      document.getElementById('contador-productos').textContent = productosFiltrados.length + ' productos';

      if (productosFiltrados.length === 0) {
        contenedor.innerHTML = '';
        sinResultados.classList.remove('d-none');
        return;
      }
      sinResultados.classList.add('d-none');

      contenedor.innerHTML = productosFiltrados.map(p => `
        <div class="card product-card position-relative">
          ${p.nuevo ? '<span class="badge-nuevo">NUEVO</span>' : ''}
          ${p.precioAnterior ? `<span class="badge-oferta">-${Math.round((1 - p.precio/p.precioAnterior)*100)}%</span>` : ''}
          <a href="producto.html?id=${p.id}">
            <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/400x500?text=Producto'">
          </a>
          <div class="card-body">
            <h6 class="card-title mb-1 text-truncate">${p.nombre}</h6>
            <div class="mb-2">
              ${p.precioAnterior ? `<span class="old-price">${formatearPrecio(p.precioAnterior)}</span>` : ''}
              <span class="price">${formatearPrecio(p.precio)}</span>
            </div>
            <a href="producto.html?id=${p.id}" class="btn btn-dark-custom btn-sm w-100">Ver detalle</a>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
